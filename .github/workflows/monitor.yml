name: Remote Job Monitor Bot

on:
  schedule:
    # Ejecuta cada 30 minutos (24/7 sin costo de infraestructura)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite ejecución manual desde la interfaz de GitHub

# Permisos necesarios para escribir y persistir vistos.json en el repositorio
permissions:
  contents: write

jobs:
  monitor:
    name: Run Job Scraper and Notifier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Job Monitor Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: Persist Seen Jobs State (vistos.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain vistos.json)" ]; then
            git add vistos.json
            git commit -m "chore: update vistos.json with latest processed jobs [skip ci]"
            git push
          else
            echo "No changes detected in vistos.json. Skipping commit."
          fi
